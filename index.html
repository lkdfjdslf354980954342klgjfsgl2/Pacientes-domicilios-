<style>
:root{--bg:#f6f5f0;--blue:#3b82f6;--green:#16a34a;--dark:#0a1931;--yellow:#facc15;--orange:#fb923c;--red:#ef4444;--fosfo:#39ff14}
*{box-sizing:border-box}body{margin:0;font-family:system-ui;background:var(--bg);padding-bottom:120px;overflow-x:hidden}
.header{position:sticky;top:0;z-index:70;background:#fff;border-bottom:2px solid var(--dark);padding:8px 10px}
.btn{border:0;border-radius:12px;padding:10px 10px;font-weight:800;cursor:pointer;min-height:42px;font-size:11px}.btn-d{background:var(--dark);color:#fff}.btn-l{background:#eee}.btn-g{background:#dcfce7;border:1px solid #16a34a}.btn-b{background:#dbeafe;border:1px solid #3b82f6}.btn-r{background:#fee;color:#900;border:1px solid #fca5a5}
.table{background:#fff;border:1px solid #ddd;border-radius:12px;overflow:auto;max-width:100vw;max-height:62dvh;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:11px;min-width:1750px}th{background:var(--dark);color:#fff;padding:8px 6px;position:sticky;top:0;z-index:2;text-align:left}td{padding:6px;border-bottom:1px solid #eee}
.pos{width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:900;cursor:grab}.pos-rawson{background:var(--green)}.pos-trinidad{background:var(--blue)}.pos-otro{background:#999}
.dot{width:20px;height:20px;border-radius:50%;display:inline-block;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px #ddd}.dot-pendiente{background:var(--orange)}.dot-si{background:var(--yellow)}.dot-hiv-si{background:var(--fosfo)}.dot-no{background:var(--red)}
.banner{padding:10px;margin:6px;border-radius:10px;display:none;white-space:pre-wrap;font-size:11px;font-weight:700}.bannerError{background:#fee;border:2px solid red;color:#900}.bannerRawson{background:#000;color:#39ff14;border:3px solid #39ff14}.bannerHorario{background:#fef9c3;border:2px solid #eab308;color:#713f12}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:100;align-items:flex-end;justify-content:center}
@media(min-width:700px){.modal{align-items:center;padding:10px}}.box{background:#fff;border-radius:16px 16px 0 0;padding:14px;max-width:700px;width:100%;max-height:92dvh;overflow:auto}
@media(min-width:700px){.box{border-radius:14px;margin:20px auto}}
input,select,textarea{padding:11px;border:1px solid #ddd;border-radius:10px;width:100%;font-size:13px;min-height:42px}
.fila-rawson-listo{background:linear-gradient(90deg,#39ff14,#00ff7f)!important;border-left:8px solid #000!important}
.fila-cambio-horario{background:#fef9c3!important;border-left:7px solid #eab308!important}
.fila-dragging{opacity:.35;background:#dbeafe!important}
.btnIcon{width:34px;height:34px;border-radius:50%;border:1px solid #ddd;background:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.btnFoto{width:34px;height:34px;border-radius:50%;border:2px solid #39ff14;background:#000;color:#39ff14}.btnFoto.hasFoto{background:#39ff14;color:#000}
#visorFoto{position:fixed;inset:0;background:#000;display:none;z-index:200;flex-direction:column}#visorFoto img{max-width:100%;max-height:80dvh;object-fit:contain;margin:auto}
.sticky-pos{position:sticky;left:0;background:#fff;border-right:2px solid #ddd;z-index:3}.sticky-acciones{position:sticky;right:0;background:#fff;border-left:2px solid #ddd;z-index:3}
.chip{padding:3px 7px;border-radius:12px;background:#eee;font-size:10px;display:inline-block}.tabs{display:flex;gap:4px;margin:6px 0}.tab{padding:8px 12px;border-radius:20px;background:#eee;cursor:pointer;font-weight:800;font-size:11px;border:1px solid #ddd}.tab.active{background:var(--dark);color:#fff}
</style>

<div class="header">
<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap">
<div style="display:flex;align-items:center;gap:8px"><img src="icon-192.png" style="width:36px;height:36px;border-radius:50%;border:2px solid #0a1931"><div><b id="tituloFecha" style="font-size:14px">EXTRACCIONES DEL HOY</b><br><small id="fecha"></small></div></div>
<div style="display:flex;gap:4px;align-items:center;flex:1;min-width:240px"><input type="date" id="fechaExtraccion" style="flex:1"><input id="gmapsKey" placeholder="Google API Key" style="flex:1;font-size:10px"><button class="btn btn-b" onclick="window.guardarKey()" style="padding:6px">💾</button></div>

</div>
</div>

<div id="importBox" class="modal"><div class="box"><h3>📋 Importar WhatsApp - Auto detecta fecha</h3><textarea id="txtImport" rows="7" placeholder="1. Lidia Vargas 2966615009 Cacique Capipe 1739 (Rawson) Bebe Alejado"></textarea><div id="importLog" style="font-family:monospace;font-size:10px;background:#000;color:#0f0;padding:6px;border-radius:6px;max-height:90px;overflow:auto;margin-top:6px"></div><div style="display:flex;gap:8px;margin-top:8px"><button class="btn btn-d" style="flex:1" onclick="window.parsearWhatsApp()">🚀 CARGAR en fecha seleccionada</button><button class="btn btn-l" style="flex:1" onclick="window.cerrarImport()">Cerrar</button></div></div></div>

<div class="table"><table><thead><tr><th class="sticky-pos">POS ↕️</th><th>✓</th><th>FECHA</th><th>HORARIO</th><th>PACIENTE</th><th>TEL</th><th>DIRECCIÓN + ENTRE CALLES</th><th>MUTUAL</th><th>COBRO</th><th>ORINA</th><th>24H</th><th>FECAL</th><th>ORDEN</th><th>HIV</th><th>DERIV</th><th>✏️</th><th>📸</th><th>💬</th><th class="sticky-acciones">🗑️</th></tr></thead><tbody id="tbody"></tbody></table></div>

<div id="modal" class="modal"><div class="box"><h3>Editar - Datos por fecha</h3>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px"><input id="f_pos" type="number" placeholder="POS"><input type="date" id="f_fecha_extra"><input id="f_horario" type="time"></div>
<input id="f_nombre" placeholder="Nombre" style="margin-top:6px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px"><input id="f_telefono" placeholder="Tel"><input id="f_dni" placeholder="DNI"></div>
<input id="f_domicilio" placeholder="Dirección"><input id="f_entre" placeholder="Entre calles auto" style="margin-top:6px"><div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px"><input id="f_origen" placeholder="Origen"><select id="f_mutual"><option>Trinidad</option><option>Rawson</option><option>Particular</option></select></div>
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:8px"><label style="display:flex;gap:4px;align-items:center;background:#fee;padding:8px;border-radius:10px;font-size:11px"><input type="checkbox" id="f_bebe" style="width:auto"> 👶 Bebé +30</label><label style="display:flex;gap:4px;align-items:center;background:#fef3c7;padding:8px;border-radius:10px;font-size:11px"><input type="checkbox" id="f_alejado" style="width:auto"> 🏜️ Alejado +30</label><label style="display:flex;gap:4px;align-items:center;background:#f3f3f3;padding:8px;border-radius:10px;font-size:11px"><input type="checkbox" id="f_pagado" style="width:auto"> Pagó?</label></div>
<input id="f_monto" type="number" placeholder="Monto" style="margin-top:6px">
<div style="background:#000;border:2px solid #39ff14;border-radius:12px;padding:8px;margin-top:8px"><label style="color:#39ff14;font-weight:900;font-size:11px">📸 FOTO ORDEN - Borrar solo foto con botón</label><input type="file" id="f_foto" accept="image/*" capture="environment" style="background:#111;color:#39ff14;margin-top:6px"><div style="display:flex;gap:6px;margin-top:6px"><button class="btn btn-l" onclick="window.verFotoActual()" style="flex:1">Ver FULL</button><button class="btn btn-r" onclick="window.quitarFoto()" style="flex:1">🗑️ Borrar foto</button></div><img id="previewFoto" style="width:100%;max-height:150px;display:none;margin-top:6px;border-radius:8px"></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px"><select id="f_estado_orina"><option value="pendiente">Orina Pend</option><option value="si">Si</option><option value="no">No</option></select><select id="f_estado_orina24"><option value="pendiente">24H Pend</option><option value="si">Si</option><option value="no">No</option></select><select id="f_estado_fecal"><option value="pendiente">Fecal Pend</option><option value="si">Si</option><option value="no">No</option></select><select id="f_estado_orden"><option value="pendiente">Orden Pend</option><option value="si">Si</option><option value="no">No</option></select><select id="f_estado_hiv"><option value="pendiente">HIV Pend</option><option value="si">Firmó</option><option value="no">No</option></select><select id="f_estado_deriv"><option value="pendiente">Deriv Pend</option><option value="si">Si</option><option value="no">No</option></select></div>
<input type="hidden" id="f_id"><input type="hidden" id="f_foto_url">
<div style="display:flex;gap:6px;margin-top:10px"><button class="btn btn-l" style="flex:1" onclick="window.cerrar()">Cancelar</button><button class="btn btn-r" style="flex:1" onclick="window.eliminarPacienteCompleto()">🗑️ Eliminar TODO</button><button class="btn btn-d" style="flex:1" onclick="window.guardar()">💾 Guardar en fecha</button></div>
</div></div>

<div id="modalFicha" class="modal"><div class="box"><h3 id="fichaTitulo">Ficha</h3><div id="fichaBody"></div><div style="display:flex;gap:6px;margin-top:10px"><button class="btn btn-l" style="flex:1" onclick="window.cerrarFicha()">Cerrar</button><button class="btn btn-d" style="flex:1" id="fichaEditarBtn">Editar</button><button class="btn btn-r" style="flex:1" id="fichaBorrarBtn">Eliminar</button></div></div></div>
<div id="visorFoto"><div style="display:flex;justify-content:space-between;padding:10px;background:#111;color:#fff"><b id="visorNombre">Foto</b><button class="btn btn-l" onclick="window.cerrarVisor()">X</button></div><img id="visorImg"><div style="padding:10px;display:flex;gap:8px;background:#111"><button class="btn btn-r" style="flex:1" onclick="window.quitarFotoDesdeVisor()">Borrar solo foto</button><button class="btn btn-d" style="flex:1" onclick="window.cerrarVisor()">Volver</button></div></div>

<script>
// SAFE STORAGE CON TRY/CATCH
window.safeStorage={_mem:{},get(k){try{return localStorage.getItem(k)}catch(e){return this._mem[k]||null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){this._mem[k]=v}},remove(k){try{localStorage.removeItem(k)}catch(e){delete this._mem[k]}}};
// PWA
if('serviceWorker' in navigator){try{navigator.serviceWorker.register('sw.js');}catch{}}
// API KEY AUTO SAVE
window.guardarKey=function(){try{const k=document.getElementById('gmapsKey').value.trim();if(!k){alert('Pegá key');return;}window.safeStorage.set('gmaps_key',k);try{localStorage.setItem('gmaps_key',k);}catch{}alert('✅ Key guardada auto');window.cargarGoogleMaps(k);}catch(e){alert(e.message);}};
window.cargarGoogleMaps=function(key){try{if(!key||window.google&&window.google.maps)return;const s=document.createElement('script');s.src='https://maps.googleapis.com/maps/api/js?key='+key+'&libraries=places,geometry';s.async=true;s.onload=function(){};document.head.appendChild(s);}catch{}};
try{const saved=window.safeStorage.get('gmaps_key');if(saved){document.getElementById('gmapsKey').value=saved;window.cargarGoogleMaps(saved);}}catch{}

window.sb=null;try{window.sb=supabase.createClient("https://bsgneveblhokjttpmbrj.supabase.co","sb_publishable_tpkAdsAtnheW3Eqx-wRW7Q_C9v0I_aY");}catch{}
window.todos=[];window.todosFiltrados=[];window.sel=new Set();window.visorId=null;window.dragSrc=null;window.solapa='hoy';
window.fechaHoy=new Date().toISOString().slice(0,10);
document.getElementById('fechaExtraccion').value=window.fechaHoy;
document.getElementById('fecha').innerText=new Date().toLocaleDateString('es-AR');
function actualizarTituloFecha(){try{const f=document.getElementById('fechaExtraccion').value||window.fechaHoy;const d=new Date(f+'T12:00:00').toLocaleDateString('es-AR');document.getElementById('tituloFecha').innerText='EXTRACCIONES DEL '+d.toUpperCase();}catch{}}
document.getElementById('fechaExtraccion').addEventListener('change',function(){actualizarTituloFecha();window.cargar();});actualizarTituloFecha();

window.mostrarError=function(t){try{const b=document.getElementById('bannerError');b.style.display='block';b.innerText='⚠️ '+t;setTimeout(()=>b.style.display='none',7000);}catch{}};
window.log=function(t){try{const b=document.getElementById('logBox');b.style.display='block';}catch{}};
window.logImport=function(t){try{document.getElementById('importLog').innerText=t+'\n'+document.getElementById('importLog').innerText;}catch{}};
document.getElementById('f_foto').addEventListener('change',function(e){try{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(ev){document.getElementById('f_foto_url').value=ev.target.result;const p=document.getElementById('previewFoto');p.src=ev.target.result;p.style.display='block';};r.readAsDataURL(f);}catch{}});

window.setSolapa=function(t){
  try{
    window.solapa=t;
    document.querySelectorAll('.tab').forEach(el=>el.classList.remove('active'));
    document.getElementById('tab-'+t).classList.add('active');
    if(t=='hoy'){document.getElementById('fechaExtraccion').value=window.fechaHoy;actualizarTituloFecha();window.cargar();}
    else if(t=='fecha'){/* deja fecha elegida */}
    else if(t=='uno'){window.mostrarUno();}
    else if(t=='todos'){window.mostrarTodos();}
  }catch(e){window.mostrarError(e.message);}
};

window.cargar=async function(){
  try{
    const fechaFiltro=document.getElementById('fechaExtraccion').value;
    const {data,error}=await window.sb.from('pacientes').select('*').order('pos');
    if(error)throw error;
    window.todos=data||[];
    let filtrados=window.todos;
    if(window.solapa=='hoy' || window.solapa=='fecha'){
      filtrados=window.todos.filter(p=>!p.fecha_extraccion || p.fecha_extraccion==fechaFiltro || (fechaFiltro==window.fechaHoy &&!p.fecha_extraccion));
      // si no hay fecha_extraccion en viejos, asumir hoy
      if(filtrados.length==0 && fechaFiltro==window.fechaHoy) filtrados=window.todos.filter(p=>!p.fecha_extraccion);
    }
    window.todosFiltrados=filtrados;
    window.render(filtrados);
  }catch(err){window.mostrarError('cargar: '+err.message);}
};
window.colorDot=function(e,t){if(e=='si')return t=='hiv'?'dot-hiv-si':'dot-si';if(e=='no')return 'dot-no';return 'dot-pendiente';};
window.esDeRawson=function(p){try{return ((p.origen||'')+' '+(p.mutual||'')).toLowerCase().includes('rawson');}catch{return false;}};
window.getDetalleRawson=function(p){let c=[];try{if(p.estado_orina=='si')c.push('ORINA');if(p.estado_orina24=='si')c.push('24H');if(p.estado_fecal=='si')c.push('FECAL');if(p.estado_orden=='si')c.push('ORDEN');if(p.estado_hiv=='si')c.push('HIV');if(p.estado_deriv=='si')c.push('DERIV');if(p.entrego_plata)c.push('PAGO');}catch{}return c;};
window.getFotoPaciente=function(p){try{return p.foto_url||p.foto_orden||window.safeStorage.get('foto_'+p.id)||'';}catch{return p.foto_url||'';}};
window.detectarEntreCalles=function(dom){try{if(!dom)return '';const calles=['Alvear','San Martin','Dorrego','Mitre','Urquiza','Belgrano','Sarmiento','Roca','Perito Moreno','Kirchner'];for(let c of calles){if(dom.toLowerCase().includes(c.toLowerCase()))return 'Cerca '+c;}return '';}catch{return '';}};

window.render=function(data){
  try{
    const tb=document.getElementById('tbody');const frag=document.createDocumentFragment();let letreros=[];let letreroHorario=[];
    data.forEach(function(p){
      const esRawson=window.esDeRawson(p);const det=window.getDetalleRawson(p);if(esRawson&&det.length)letreros.push('📍 '+p.nombre+' - '+det.join('+'));
      if(p.cambio_horario){letreroHorario.push('⏰ '+p.nombre+' cambió a '+(p.horario||''));}
      const tr=document.createElement('tr');tr.draggable=true;tr.dataset.id=p.id;
      if(esRawson&&det.length)tr.className='fila-rawson-listo';if(p.cambio_horario)tr.className+=' fila-cambio-horario';
      let posClass='pos-otro';if(esRawson)posClass='pos-rawson';else if((p.mutual||'').toLowerCase().includes('trinidad'))posClass='pos-trinidad';
      const fotoSrc=window.getFotoPaciente(p);const tieneFoto=!!fotoSrc;
      const entre=p.entre_calles||window.detectarEntreCalles(p.domicilio||'');
      tr.innerHTML='<td class="sticky-pos"><div class="pos '+posClass+'" title="Arrastrá para intercambiar">'+(p.pos||'')+'</div></td><td><input type="checkbox" '+(window.sel.has(p.id)?'checked':'')+' onchange="window.toggle('+p.id+')"></td><td><small>'+(p.fecha_extraccion||'hoy')+'</small></td><td><input type="time" value="'+(p.horario||'')+'" onchange="window.cambiarHorario('+p.id+',this.value)" style="width:86px;padding:4px"><br>'+(p.cambio_horario?'<span class="chip" style="background:#fde68a">cambió horario</span>':'')+'</td><td><b>'+(p.nombre||'')+'</b>'+(p.es_bebe?'<br><span class="chip" style="background:#fecaca">👶 +30</span>':'')+(p.barrio_alejado?'<br><span class="chip" style="background:#fde68a">🏜️ +30</span>':'')+'</td><td>'+(p.telefono||'')+'</td><td><small>'+(p.domicilio||'')+'<br><i style="color:#666">'+entre+'</i></small></td><td>'+(p.mutual||'')+'</td><td>$'+(p.monto_plata||0)+'</td><td><span class="dot '+window.colorDot(p.estado_orina||'pendiente')+'" onclick="window.cambiarEstado('+p.id+',\'estado_orina\')"></span></td><td><span class="dot '+window.colorDot(p.estado_orina24||'pendiente')+'" onclick="window.cambiarEstado('+p.id+',\'estado_orina24\')"></span></td><td><span class="dot '+window.colorDot(p.estado_fecal||'pendiente')+'" onclick="window.cambiarEstado('+p.id+',\'estado_fecal\')"></span></td><td><span class="dot '+window.colorDot(p.estado_orden||'pendiente')+'" onclick="window.cambiarEstado('+p.id+',\'estado_orden\')"></span></td><td><span class="dot '+window.colorDot(p.estado_hiv||'pendiente','hiv')+'" onclick="window.cambiarEstado('+p.id+',\'estado_hiv\')"></span></td><td><span class="dot '+window.colorDot(p.estado_deriv||'pendiente')+'" onclick="window.cambiarEstado('+p.id+',\'estado_deriv\')"></span></td><td><button class="btnIcon" onclick="window.editar('+p.id+')">✏️</button></td><td><button class="btnFoto '+(tieneFoto?'hasFoto':'')+'" onclick="window.abrirVisor('+p.id+')">'+(tieneFoto?'📸':'➕')+'</button></td><td><button class="btnIcon" onclick="window.
