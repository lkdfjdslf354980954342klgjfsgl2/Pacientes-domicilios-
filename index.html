<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pacientes Domicilios - Trinidad</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{font-family:system-ui,Arial;background:#0f0f0f;color:#eee;margin:0;padding:12px}
  h1{font-size:22px;text-align:center}
 .card{background:#1e1e1e;border-radius:12px;padding:12px;margin:10px 0;border:1px solid #333}
 .menor{background:#4a1515!important;border:1px solid #ff4444}
  input,textarea,select{width:100%;padding:8px;margin:4px 0;border-radius:8px;border:1px solid #444;background:#222;color:#fff;box-sizing:border-box}
  button{padding:10px 14px;border-radius:10px;border:0;font-weight:bold;margin:4px}
 .btn-green{background:#1db954;color:#000}
 .btn-red{background:#ff3b3b;color:#fff}
 .btn-gray{background:#333;color:#fff}
 .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
 .checks label{display:block;padding:4px 0}
 .topbar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  img.foto{width:100%;border-radius:10px;margin-top:8px;max-height:280px;object-fit:cover}
</style>
</head>
<body>
<h1>🏥 Pacientes Domicilios</h1>
<div class="topbar">
  <button class="btn-gray" onclick="cargar()">🔄 Recargar</button>
  <button class="btn-green" onclick="document.getElementById('form').style.display='block'">+ Nuevo</button>
</div>
<div class="card">
  <h3>Pegar parte Carina Jefa:</h3>
  <textarea id="pasteCarina" rows="4" placeholder="12- Smith John 45a M..."></textarea>
  <button class="btn-green" onclick="parsearCarina()">Parsear</button>
</div>
<div id="form" class="card" style="display:none">
  <div class="grid2">
    <input id="f_pos" type="number" placeholder="Pos">
    <input id="f_nombre" placeholder="Nombre">
    <input id="f_edad" type="number" placeholder="Edad">
    <select id="f_sexo"><option value="">Sexo</option><option>M</option><option>F</option></select>
    <input id="f_telefono" placeholder="Tel">
    <input id="f_dni" placeholder="DNI">
  </div>
  <input id="f_domicilio" placeholder="Domicilio">
  <div class="grid2">
    <input id="f_origen" value="Trinidad">
    <input id="f_mutual" placeholder="Mutual">
    <input id="f_monto" placeholder="Monto">
  </div>
  <div class="checks">
    <label><input type="checkbox" id="f_orina"> Orina</label>
    <label><input type="checkbox" id="f_orina24"> Orina 24h</label>
    <label><input type="checkbox" id="f_fecal"> Fecal</label>
    <label><input type="checkbox" id="f_orden"> Orden</label>
    <label><input type="checkbox" id="f_plata"> Plata</label>
    <label><input type="checkbox" id="f_deriv"> Derivación</label>
  </div>
  <input id="f_detalle_deriv" placeholder="Detalle deriv">
  <input type="file" accept="image/*" onchange="fotoToBase64(this)">
  <input type="hidden" id="f_foto_b64"><input type="hidden" id="f_id">
  <button class="btn-green" onclick="guardar()">💾 Guardar</button>
  <button class="btn-gray" onclick="document.getElementById('form').style.display='none'">Cancelar</button>
</div>
<div id="lista"></div>
<script>
const SUPABASE_URL = "https://bsgneveblhokjttpmbrj.supabase.co";
const SUPABASE_KEY = "sb_publishable_tpkAdsAtnheW3Eqx-wRW7Q_C9v0I_aY";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let fotoTemp="";
function fotoToBase64(i){const f=i.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{fotoTemp=e.target.result;document.getElementById('f_foto_b64').value=fotoTemp};r.readAsDataURL(f)}
async function cargar(){
  const {data,error}=await supabaseClient.from('pacientes').select('*').order('pos',{ascending:true});
  if(error){alert(error.message);return}
  const cont=document.getElementById('lista');cont.innerHTML="";
  data.forEach(p=>{
    const esMenor=p.edad!==null&&p.edad<8;
    const d=document.createElement('div');d.className='card'+(esMenor?' menor':'');
    d.innerHTML=`<b>${p.pos??''} - ${p.nombre||''}</b> ${esMenor?'⚠️ MENOR DE 8':''}<br>${p.edad?p.edad+'a':''} ${p.sexo||''} ${p.telefono?'📞'+p.telefono:''}<br>${p.domicilio||''} (${p.origen||''})<br><small>${p.entrego_orina?'✅Orina ':''}${p.tiene_orina_24h?'✅24h ':''}${p.tiene_materia_fecal?'💩Fecal ':''}${p.entrego_orden?'📄Orden ':''}${p.entrego_plata?'💰'+(p.monto_plata||''):''}${p.tiene_derivacion?'↗️'+(p.detalle_derivacion||''):''}</small>${p.foto_base64?`<img class=foto src="${p.foto_base64}">`:''}<div class=topbar><button class=btn-gray onclick='editar(${JSON.stringify(p).replace(/'/g,"&#39;")})'>✏️</button><button class=btn-red onclick="eliminar(${p.id})">🗑️</button></div>`;
    cont.appendChild(d)
  })
}
function editar(p){document.getElementById('form').style.display='block';document.getElementById('f_id').value=p.id;document.getElementById('f_pos').value=p.pos||'';document.getElementById('f_nombre').value=p.nombre||'';document.getElementById('f_edad').value=p.edad||'';document.getElementById('f_sexo').value=p.sexo||'';document.getElementById('f_telefono').value=p.telefono||'';document.getElementById('f_dni').value=p.dni||'';document.getElementById('f_domicilio').value=p.domicilio||'';document.getElementById('f_origen').value=p.origen||'Trinidad';document.getElementById('f_mutual').value=p.mutual||'';document.getElementById('f_monto').value=p.monto_plata||'';document.getElementById('f_orina').checked=p.entrego_orina||false;document.getElementById('f_orina24').checked=p.tiene_orina_24h||false;document.getElementById('f_fecal').checked=p.tiene_materia_fecal||false;document.getElementById('f_orden').checked=p.entrego_orden||false;document.getElementById('f_plata').checked=p.entrego_plata||false;document.getElementById('f_deriv').checked=p.tiene_derivacion||false;document.getElementById('f_detalle_deriv').value=p.detalle_derivacion||'';document.getElementById('f_foto_b64').value=p.foto_base64||'';fotoTemp=p.foto_base64||''}
async function guardar(){
  const id=document.getElementById('f_id').value;
  const payload={pos:parseInt(document.getElementById('f_pos').value)||null,nombre:document.getElementById('f_nombre').value,edad:parseInt(document.getElementById('f_edad').value)||null,sexo:document.getElementById('f_sexo').value||null,telefono:document.getElementById('f_telefono').value||null,dni:document.getElementById('f_dni').value||null,domicilio:document.getElementById('f_domicilio').value||null,origen:document.getElementById('f_origen').value||'Trinidad',mutual:document.getElementById('f_mutual').value||null,monto_plata:document.getElementById('f_monto').value||null,entrego_orina:document.getElementById('f_orina').checked,tiene_orina_24h:document.getElementById('f_orina24').checked,tiene_materia_fecal:document.getElementById('f_fecal').checked,entrego_orden:document.getElementById('f_orden').checked,entrego_plata:document.getElementById('f_plata').checked,tiene_derivacion:document.getElementById('f_deriv').checked,detalle_derivacion:document.getElementById('f_detalle_deriv').value||null,foto_base64:document.getElementById('f_foto_b64').value||fotoTemp||null};
  let err;if(id){const r=await supabaseClient.from('pacientes').update(payload).eq('id',id);err=r.error}else{const r=await supabaseClient.from('pacientes').insert(payload);err=r.error}
  if(err){alert(err.message);return}document.getElementById('form').style.display='none';document.getElementById('f_id').value='';fotoTemp='';cargar()
}
async function eliminar(id){if(!confirm('Borrar?'))return;const {error}=await supabaseClient.from('pacientes').delete().eq('id',id);if(error)alert(error.message);else cargar()}
function parsearCarina(){const txt=document.getElementById('pasteCarina').value;if(!txt.trim())return;const edadM=txt.match(/(\d{1,2})\s*a/i);const sexoM=txt.match(/\b([MF])\b/);const telM=txt.match(/(?:tel|cel|wsp)?\s*([0-9]{6,15})/i);let nombre=txt.split('-')[1]||txt;nombre=nombre.split(/\d/)[0].trim();document.getElementById('form').style.display='block';document.getElementById('f_nombre').value=nombre.substring(0,60);if(edadM)document.getElementById('f_edad').value=edadM[1];if(sexoM)document.getElementById('f_sexo').value=sexoM[1].toUpperCase();if(telM)document.getElementById('f_telefono').value=telM[1];if(/orina/i.test(txt))document.getElementById('f_orina').checked=true;if(/24h/i.test(txt))document.getElementById('f_orina24').checked=true;if(/fecal|materia/i.test(txt))document.getElementById('f_fecal').checked=true;if(/orden/i.test(txt))document.getElementById('f_orden').checked=true;if(/plata|pagó|\$/.test(txt))document.getElementById('f_plata').checked=true;document.getElementById('f_domicilio').value=txt}
cargar();
</script>
</body>
</html>
