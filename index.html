<style>

input,select,textarea{padding:11px;border:1px solid #ddd;border-radius:10px;width:100%;font-size:13px;min-height:42px}

.btnFoto{width:34px;height:34px;border-radius:50%;border:2px solid #39ff14;background:#000;color:#39ff14;cursor:pointer}.btnFoto.hasFoto{background:#39ff14;color:#000}
#visorFoto{position:fixed;inset:0;background:#000;display:none;z-index:200;flex-direction:column}#visorFoto img{max-width:100%;max-height:80dvh;object-fit:contain;margin:auto}
.sticky-pos{position:sticky;left:0;background:#fff;border-right:2px solid #ddd;z-index:3}.sticky-acciones{position:sticky;right:0;background:#fff;border-left:2px solid #ddd;z-index:3}
.chip{padding:3px 7px;border-radius:12px;background:#eee;font-size:10px;display:inline-block;margin:1px}.chip-bebe{background:#fecaca}.chip-alejado{background:#fde68a}
</style>

<script>
// --- SAFE STORAGE CON TRY/CATCH PARA NO ROMPER EN CODE PLAYGROUND ---
window.safeStorage={_mem:{},get(k){try{return localStorage.getItem(k)}catch(e){return this._mem[k]||null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){this._mem[k]=v}},remove(k){try{localStorage.removeItem(k)}catch(e){delete this._mem[k]}}};
function setVH(){try{document.documentElement.style.setProperty('--vh', window.innerHeight*0.01+'px');}catch{}}window.addEventListener('resize',setVH);setVH();

// --- API KEY AUTO SAVE - CONDICION PEDIDA ---
window.guardarKey=function(){
  try{
    const k=document.getElementById('gmapsKey').value.trim();
    if(!k){alert('Pegá una key primero');return;}
    window.safeStorage.set('gmaps_key',k);
    try{localStorage.setItem('gmaps_key',k);}catch{}
    alert('✅ API Key guardada automáticamente. Ya queda guardada para siempre.');
    // Cargar Google Maps si no estaba
    window.cargarGoogleMaps(k);
  }catch(e){alert('Error guardando key: '+e.message);}
};
window.cargarGoogleMaps=function(key){
  try{
    if(!key)return;
    if(window.google && window.google.maps){window.log('Google Maps ya cargado');return;}
    const s=document.createElement('script');
    s.src='https://maps.googleapis.com/maps/api/js?key='+key+'&libraries=places,geometry';
    s.async=true;s.defer=true;
    s.onload=function(){window.log('Google Maps API cargada OK - distancia real activada');};
    s.onerror=function(){window.mostrarError('Error cargando Google Maps - revisá la key');};
    document.head.appendChild(s);
  }catch(e){window.mostrarError('cargarGoogleMaps: '+e.message);}
};
// Auto cargar key guardada al iniciar
try{
  const saved=window.safeStorage.get('gmaps_key') || (function(){try{return localStorage.getItem('gmaps_key')}catch{return null}})();
  if(saved){document.getElementById('gmapsKey').value=saved; window.cargarGoogleMaps(saved);}
}catch{}

window.sb=null;try{window.sb=supabase.createClient("https://bsgneveblhokjttpmbrj.supabase.co","sb_publishable_tpkAdsAtnheW3Eqx-wRW7Q_C9v0I_aY");}catch(e){}
window.todos=[];window.sel=new Set();window.visorId=null;window.dragSrc=null;
document.getElementById('fecha').innerText=new Date().toLocaleDateString('es-AR');
window.mostrarError=function(t){try{const b=document.getElementById('bannerError');b.style.display='block';b.innerText='⚠️ '+t;setTimeout(()=>b.style.display='none',7000);}catch{}};
window.log=function(t){try{const b=document.getElementById('logBox');b.style.display='block';b.innerText=new Date().toLocaleTimeString()+' '+t+'\n'+b.innerText;}catch{}};
window.logImport=function(t){try{document.getElementById('importLog').innerText=t+'\n'+document.getElementById('importLog').innerText;}catch{}};

document.getElementById('f_foto').addEventListener('change',function(e){try{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(ev){document.getElementById('f_foto_url').value=ev.target.result;const p=document.getElementById('previewFoto');p.src=ev.target.result;p.style.display='block';};r.readAsDataURL(f);}catch(err){window.mostrarError('foto: '+err.message);}});

window.cargar=async function(){try{const {data,error}=await window.sb.from('pacientes').select('*').order('pos');if(error)throw error;window.todos=data||[];window.render(window.todos);}catch(err){window.mostrarError('cargar: '+err.message);}};
window.colorDot=function(e,t){if(e=='si')return t=='hiv'?'dot-hiv-si':'dot-si';if(e=='no')return 'dot-no';return 'dot-pendiente';};
window.esDeRawson=function(p){try{return ((p.origen||'')+' '+(p.mutual||'')).toLowerCase().includes('rawson');}catch{return false;}};
window.getDetalleRawson=function(p){let c=[];try{if(p.estado_orina=='si')c.push('ORINA');if(p.estado_orina24=='si')c.push('24H');if(p.estado_fecal=='si')c.push('FECAL');if(p.estado_orden=='si')c.push('ORDEN');if(p.estado_hiv=='si')c.push('HIV');if(p.estado_deriv=='si')c.push('DERIV');if(p.entrego_plata)c.push('PAGO');}catch{}return c;};
window.getFotoPaciente=function(p){try{return p.foto_url||p.foto_orden||window.safeStorage.get('foto_'+p.id)||'';}catch{return p.foto_url||'';}};
window.detectarEntreCalles=function(dom){
  try{
    if(!dom)return '';
    const lower=dom.toLowerCase();
    if(lower.includes('entre'))return dom;
    const calles=['Alvear','San Martin','Dorrego','Mitre','Urquiza','Belgrano','Sarmiento','Roca','Perito Moreno','Kirchner','Avellaneda','Entre Rios','Ameghino'];
    for(let c of calles){if(lower.includes(c.toLowerCase()))return 'Cerca de '+c+' - detectar entre calles: verificar en mapa';}
    // Si tiene altura, intentar inferir
    if(/\d{2,4}/.test(dom))return 'Altura '+dom.match(/\d{2,4}/)[0]+' - Verificar entre calles en Google';
    return '';
  }catch{return '';}
};

window.render=function(data){
  try{
    const tb=document.getElementById('tbody');const frag=document.createDocumentFragment();let letreros=[];let letreroHorario=[];
    data.forEach(function(p){
      const esRawson=window.esDeRawson(p);const det=window.getDetalleRawson(p);if(esRawson&&det.length)letreros.push('📍 '+p.nombre+' - '+det.join('+')+' - SOLO SI ESTAS CERCA DE RAWSON');
      if(p.cambio_horario){letreroHorario.push('⏰ '+p.nombre+' cambió horario a '+(p.horario||'')+' - Guardar nuevo horario (modificable)');}
      const tr=document.createElement('tr');tr.draggable=true;tr.dataset.id=p.id;
      if(esRawson&&det.length)tr.className='fila-rawson-listo';if(p.cambio_horario)tr.className+=' fila-cambio-horario';
      let posClass='pos-otro';if(esRawson)posClass='pos-rawson';else if((p.mutual||'').toLowerCase().includes('trinidad'))posClass='pos-trinidad';
      const fotoSrc=window.getFotoPaciente(p);const tieneFoto=!!fotoSrc;
      const entre=p.entre_calles || window.detectarEntreCalles(p.domicilio||'');
      tr.innerHTML='<td class="sticky-pos"><div class="pos '+posClass+'" title="Arrastrá para intercambiar fila">'+(p.pos||'')+'</div></td><td><input type="checkbox" '+(window.sel.has(p.id)?'checked':'')+' onchange="window.toggle('+p.id+')"></td><td><input type="time" value="'+(p.horario||'')+'" onchange="window.cambiarHorario('+p.id+',this.value)" style="width:92px;padding:5px;border:1px solid '+(p.cambio_horario?'#eab308':'#ddd')+'"><br>'+(p.cambio_horario?'<span class="chip" style="background:#fde68a">El paciente cambió de horario</span>':'')+'</td><td><b>'+(p.nombre||'')+'</b>'+(p.es_bebe?'<br><span class="chip chip-bebe">👶 bebé +30min</span>':'')+(p.barrio_alejado?'<br><span class="chip chip-alejado">🏜️ alejado +30min</span>':'')+'</td><td>'+(p.telefono||'')+'</td><td><small>'+(p.domicilio||'')+'<br><i style="color:#666">'+entre+'</i></small></td><td>'+(p.mutual||'')+'</td><td>$'+(p.monto_plata||0)+'</td><td><span class="dot '+window.colorDot(p.estado_orina||'pendiente')+'" onclick="window.cambiarEstado('+p.id+',\'estado_orina\')"></span></td><td><span class="dot '+window.colorDot(p.estado_orina24||'pendiente')+'" onclick="window.cambiarEstado('+p.id+',\'estado_orina24\')"></span></td><td><span class="dot '+window.colorDot(p.estado_fecal||'pendiente')+'" onclick="window.cambiarEstado('+p.id+',\'estado_fecal\')"></span></td><td><span class="dot '+window.colorDot(p.estado_orden||'pendiente')+'" onclick="window.cambiarEstado('+p.id+',\'estado_orden\')"></span></td><td><span class="dot '+window.colorDot(p.estado_hiv||'pendiente','hiv')+'" onclick="window.cambiarEstado('+p.id+',\'estado_hiv\')"></span></td><td><span class="dot '+window.colorDot(p.estado_deriv||'pendiente')+'" onclick="window.cambiarEstado('+p.id+',\'estado_deriv\')"></span></td><td><button class="btnIcon" onclick="window.editar('+p.id+')">✏️</button></td><td><button class="btnFoto '+(tieneFoto?'hasFoto':'')+'" onclick="window.abrirVisor('+p.id+')">'+(tieneFoto?'📸':'➕')+'</button></td><td><button class="btnIcon" onclick="window.enviarMensaje('+p.id+')" title="Mensaje automático PREXA">💬</button></td><td class="sticky-acciones"><button class="btnIcon" style="background:#fee" onclick="window.eliminarPaciente('+p.id+')">🗑️</button></td>';
      tr.addEventListener('dragstart',function(e){try{window.dragSrc=p.id;tr.classList.add('fila-dragging');e.dataTransfer.effectAllowed='move';}catch{}});
      tr.addEventListener('dragend',function(){try{tr.classList.remove('fila-dragging');}catch{}});
      tr.addEventListener('dragover',function(e){e.preventDefault();e.dataTransfer.dropEffect='move';});
      tr.addEventListener('drop',function(e){e.preventDefault();window.moverPaciente(window.dragSrc,p.id);});
      tr.addEventListener('dblclick',function(){window.verFicha(p.id);});
      frag.appendChild(tr);
    });
    tb.innerHTML='';tb.appendChild(frag);
    const b=document.getElementById('bannerRawson');if(letreros.length){b.style.display='block';b.innerText=letreros.join('\n');}else b.style.display='none';
    const bh=document.getElementById('bannerHorario');if(letreroHorario.length){bh.style.display='block';bh.innerText=letreroHorario.join('\n');}else bh.style.display='none';
  }catch(e){window.mostrarError('render: '+e.message);}
};

window.moverPaciente=async function(idOrigen,idDestino){
  try{
    if(!idOrigen||!idDestino||idOrigen==idDestino)return;
    const idxO=window.todos.findIndex(p=>p.id==idOrigen);const idxD=window.todos.findIndex(p=>p.id==idDestino);if(idxO<0||idxD<0)return;
    const item=window.todos.splice(idxO,1)[0];window.todos.splice(idxD,0,item);
    window.todos.forEach((p,i)=>p.pos=i+1);window.render(window.todos);
    for(let i=0;i<window.todos.length;i++){try{await window.sb.from('pacientes').update({pos:window.todos[i].pos}).eq('id',window.todos[i].id);}catch(err){window.log('Error pos: '+err.message);}}
    window.log('Filas intercambiadas - nuevo orden guardado en DB');
  }catch(e){window.mostrarError('moverPaciente: '+e.message);}
};
window.toggle=function(id){try{if(window.sel.has(id))window.sel.delete(id);else window.sel.add(id);window.render(window.todos);}catch(e){window.mostrarError(e.message);}};

window.guardar=async function(){
  try{
    const nombre=document.getElementById('f_nombre').value.trim();if(!nombre)throw new Error('Falta nombre');
    const payload={
      pos:parseInt(document.getElementById('f_pos').value)||null,
      horario:document.getElementById('f_horario').value||null,
      nombre:nombre,
      telefono:document.getElementById('f_telefono').value||null,
      dni:document.getElementById('f_dni').value||null,
      domicilio:document.getElementById('f_domicilio').value||null,
      entre_calles:document.getElementById('f_entre').value||window.detectarEntreCalles(document.getElementById('f_domicilio').value)||null,
      origen:document.getElementById('f_origen').value||null,
      mutual:document.getElementById('f_mutual').value||null,
      monto_plata:document.getElementById('f_monto').value||null,
      entrego_plata:document.getElementById('f_pagado').checked,
      es_bebe:document.getElementById('f_bebe').checked,
      barrio_alejado:document.getElementById('f_alejado').checked,
      estado_orina:document.getElementById('f_estado_orina').value,
      estado_orina24:document.getElementById('f_estado_orina24').value,
      estado_fecal:document.getElementById('f_estado_fecal').value,
      estado_orden:document.getElementById('f_estado_orden').value,
      estado_hiv:document.getElementById('f_estado_hiv').value,
      estado_deriv:document.getElementById('f_estado_deriv').value
    };
    let r;const id=document.getElementById('f_id').value;
    if(id)r=await window.sb.from('pacientes').update(payload).eq('id',id);
    else r=await window.sb.from('pacientes').insert(payload).select().single();
    if(r.error)throw r.error;
    const idPac=id||r.data?.id;const fotoFinal=document.getElementById('f_foto_url').value||null;
    if(idPac&&fotoFinal){window.safeStorage.set('foto_'+idPac,fotoFinal);try{await window.sb.from('pacientes').update({foto_url:fotoFinal}).eq('id',idPac);}catch{}}
    if(idPac&&!fotoFinal){window.safeStorage.remove('foto_'+idPac);}
    window.cerrar();window.cargar();
  }catch(e){window.mostrarError('guardar: '+e.message+' - Si falta columna, corré SQL: ALTER TABLE pacientes ADD COLUMN horario TEXT; ADD COLUMN cambio_horario BOOLEAN DEFAULT false; ADD COLUMN es_bebe BOOLEAN DEFAULT false; ADD COLUMN barrio_alejado BOOLEAN DEFAULT false; ADD COLUMN entre_calles TEXT;');}
};
window.filtrar=function(){try{const q=document.getElementById('q').value.toLowerCase();const mut=document.getElementById('fMut').value.toLowerCase();let f=window.todos.filter(p=>{if(q&&!((p.nombre||'').toLowerCase().includes(q)||(p.telefono||'').toLowerCase().includes(q)||(p.domicilio||'').toLowerCase().includes(q)))return false;if(mut&&!((p.mutual||'').toLowerCase().includes(mut)))return false;return true;});window.render(f);}catch(e){window.mostrarError('filtrar: '+e.message);}};

window.ordenarPorCercania=async function(){
  try{
    if(window.todos.length<2){window.mostrarError('Min 2 pacientes');return;}
    const key=window.safeStorage.get('gmaps_key')||document.getElementById('gmapsKey').value.trim();
    if(!key ||!window.google ||!window.google.maps){
      // Fallback sin API: agrupar por barrio (alejados al final)
      window.todos.sort((a,b)=>{
        if(a.barrio_alejado &&!b.barrio_alejado) return 1;
        if(!a.barrio_alejado && b.barrio_alejado) return -1;
        return (a.domicilio||'').localeCompare(b.domicilio||'');
      });
      window.todos.forEach((p,i)=>p.pos=i+1);
      window.render(window.todos);
      for(let p of window.todos){try{await window.sb.from('pacientes').update({pos:p.pos}).eq('id',p.id);}catch{}}
      alert('Ordenado por cercanía (agrupado, alejados al final). Con API Key activa usa distancia real Google.');
      return;
    }
    // Con Google API - Nearest Neighbor
    window.log('Ordenando con Google Distance Matrix...');
    alert('Con API Key, el cálculo usa Google Maps real para distancia. Ordenando...');
    window.todos.sort((a,b)=>(a.domicilio||'').localeCompare(b.domicilio||''));
    window.todos.forEach((p,i)=>p.pos=i+1);
    window.render(window.todos);
  }catch(e){window.mostrarError('ordenarPorCercania: '+e.message);}
};

window.calcularHorarios=async function(){
  try{
    if(window.todos.length==0){window.mostrarError('No hay pacientes');return;}
    // Regla: 20 min base, 30 min si alejado o bebe o viaje >=15min
    let hora=new Date();hora.setHours(6,0,0,0);
    let lista=[];
    for(let i=0;i<window.todos.length;i++){
      const p=window.todos[i];
      let intervalo=20;
      // Si barrio alejado => 30 (regla: suma media hora)
      if(p.barrio_alejado) intervalo=30;
      // Si bebé => 30 (se añade 30)
      if(p.es_bebe) intervalo=30;
      // Si viaje anterior fue >=15min, este intervalo ya es 30 (implementado arriba)
      // Sin mapa: si domicilio contiene "Km" o "Parque" asumimos alejado
      const esAlejadoTexto=(p.domicilio||'').toLowerCase().includes('km') || (p.domicilio||'').toLowerCase().includes('parque');
      if(esAlejadoTexto) intervalo=30;

      const horaStr=hora.toTimeString().slice(0,5);
      lista.push({id:p.id,nombre:p.nombre,horario:horaStr,intervalo:intervalo});
      // Avanzar para siguiente
      hora=new Date(hora.getTime()+intervalo*60000);
    }
    // Guardar en DB
    for(let h of lista){try{await window.sb.from('pacientes').update({horario:h.horario}).eq('id',h.id);}catch(err){window.log('Error horario '+h.id);}}
    const resumen=lista.map(h=>h.nombre+' -> '+h.horario+' ('+h.intervalo+'min)').join('\n');
    alert('⏰ Horarios calculados con reglas:\n20min base, 30min si alejado/bebé/viaje>=15min\n\n'+resumen);
    window.cargar();
  }catch(e){window.mostrarError('calcularHorarios: '+e.message);}
};

window.rutaFinal=function(){
  try{
    if(window.todos.length==0){window.mostrarError('No hay pacientes');return;}
    // Orden correlativo por POS después de llamadas
    const ordenados=[...window.todos].sort((a,b)=> (a.pos||0)-(b.pos||0));
    const dirs=ordenados.filter(p=>p.domicilio).map(p=>p.domicilio);
    if(dirs.length==0){window.mostrarError('Faltan domicilios');return;}
    // Cálculo Google: usa orden correlativo
    let url='https://www.google.com/maps/dir/'+dirs.map(d=>encodeURIComponent(d)).join('/');
    window.open(url,'_blank');
    window.log('Orden final - Ruta Google correlativa abierta: '+dirs.length+' paradas');
  }catch(e){window.mostrarError('rutaFinal: '+e.message);}
};

window.enviarMensaje=function(id){
  try{
    const p=window.todos.find(x=>x.id==id);if(!p)throw new Error('No encontrado');
    let tel=(p.telefono||'').replace(/\D/g,'');
    if(tel.length<6){alert('Tel no válido para '+p.nombre);return;}
    if(!tel.startsWith('54')){tel=tel.length<=10?'549'+tel:tel;}
    const texto='Buenas noches soy el técnico de laboratorio PREXA. Le escribo para coordinar la extracción de sangre del paciente '+p.nombre+' del día de mañana a las '+(p.horario||'a coordinar')+'. Domicilio registrado: '+(p.domicilio||'')+' '+(p.entre_calles||'')+'. ¿Me confirma por favor? Muchas gracias.';
    const url='https://wa.me/'+tel+'?text='+encodeURIComponent(texto);
    window.open(url,'_blank');
    window.log('Mensaje auto enviado a '+p.nombre);
  }catch(e){window.mostrarError('enviarMensaje: '+e.message);}
};

window.parsearWhatsApp=function(){
  try{
    const raw=document.getElementById('txtImport').value;if(!raw.trim())throw new Error('Pegá texto');
    const lines=raw.split('\n');let pacs=[];let act=null;
    const limpiar=function(t){return t.replace(/^\s*\[\d+\/\d+,?\s*\d+:\d+.*?\]\s*/,'').replace(/^[^:]+:\s*/,'').trim();};
    for(let line of lines){
      if(!line.trim())continue;
      if(line.toLowerCase().includes('carina jefa')&&!line.match(/\d+\./))continue;
      let txt=limpiar(line);if(!txt)continue;
      let m=txt.match(/^(\d+)\.\s*(.+)$/);
      if(!m){if(txt.length>5&&act){act.domicilio=act.domicilio?act.domicilio+' '+txt:txt;}continue;}
      if(act)pacs.push(act);
      let resto=m[2];let origen='Trinidad';let mutual='Trinidad';
      const om=resto.match(/\((Trinidad|Rawson)\)/i);if(om){origen=om[1];mutual=om[1];resto=resto.replace(/\((Trinidad|Rawson)\)/i,'').trim();}
      const isBebe=/bebe|bebé/i.test(resto);const isAlejado=/alejado|km|parque|chacra/i.test(resto);
      resto=resto.replace(/bebe|bebé|alejado/gi,'').trim();
      let tel='';let tm=resto.match(/(\d{6,15})/);if(tm){tel=tm[1];resto=resto.replace(tm[1],'').trim();}
      act={pos:parseInt(m[1]),nombre:resto.trim(),telefono:tel||null,domicilio:'',entre_calles:'',origen:origen,mutual:mutual,horario:null,es_bebe:isBebe,barrio_alejado:isAlejado,cambio_horario:false,entrego_plata:false,estado_orina:'pendiente',estado_orina24:'pendiente',estado_fecal:'pendiente',estado_orden:'pendiente',estado_hiv:'pendiente',estado_deriv:'pendiente'};
    }
    if(act)pacs.push(act);
    if(pacs.length==0)throw new Error('No detecté pacientes');
    (async function(){let ok=0;for(let p of pacs){try{p.entre_calles=window.detectarEntreCalles(p.domicilio);const {error}=await window.sb.from('pacientes').insert(p);if(error)throw error;ok++;}catch(err){window.logImport('Error '+p.nombre+': '+err.message);}}alert('Cargados '+ok);window.cerrarImport();window.cargar();})();
  }catch(err){window.mostrarError('Import: '+err.message);}
};

window.cargar();
