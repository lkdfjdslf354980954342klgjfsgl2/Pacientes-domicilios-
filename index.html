<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pacientes Domicilios PRO - Escalable</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-2 md:p-4">
<div class="max-w-7xl mx-auto">

<!-- ================= CONFIGURACION ESCALABLE ================= -->
<script>
  // ACA PODES AGREGAR MAS FUNCIONES FACIL
  const CONFIG = {
    SUPABASE_URL: 'https://bsgneveblhokjttpmbrj.supabase.co',
    SUPABASE_KEY: 'sb_publishable_tpkAdsAtnheW3Eqx-wRW7Q_C9v0I_aY',
    TABLA: 'pacientes',
    COLORES: { Trinidad: 'bg-blue-200', Rawson: 'bg-green-200' }
  };

  // ACA PODES AGREGAR MAS TIPOS DE ENTREGA (ej: hisopado, sangre, etc)
  const TIPOS_ENTREGA = {
    orina: { campo: 'entrego_orina', label: 'ORINA', banner: 'ORINA' },
    orina24: { campo: 'tiene_orina_24h', label: 'Orina 24h', banner: 'ORINA 24 HORAS' },
    orden: { campo: 'entrego_orden', label: 'Orden', banner: 'ORDEN' },
    plata: { campo: 'entrego_plata', label: 'Plata', banner: 'PLATA' },
    derivacion: { campo: 'tiene_derivacion', label: 'Deriv', banner: 'DERIVACIÓN' }
  };
</script>

<h1 class="text-2xl font-bold mb-2">Pacientes Domicilios PRO</h1>

<!-- BANNER INTELIGENTE ESCALABLE -->
<div id="bannerRawson" class="hidden bg-red-600 text-white p-4 rounded-lg mb-4 shadow-lg">
  <h2 class="text-xl font-bold animate-pulse">🚨 LLEVAR A RAWSON:</h2>
  <div id="bannerLista" class="mt-2 space-y-1"></div>
</div>

<!-- IMPORTADOR WHATSAPP ESCALABLE -->
<div class="bg-white p-3 rounded shadow mb-3">
  <h3 class="font-bold">1. Pegar WhatsApp:</h3>
  <textarea id="waInput" rows="5" class="w-full border p-2 rounded text-sm mt-1" placeholder="Ej: Jose Listorti - Rawson - orina 24hs, orden, 5000 pesos derivacion"></textarea>
  <div class="flex gap-2 mt-2 flex-wrap">
    <button onclick="App.parsearWhatsApp()" class="bg-blue-600 text-white px-4 py-2 rounded font-bold">Convertir</button>
    <button onclick="App.guardar()" class="bg-green-600 text-white px-4 py-2 rounded">Guardar en Supabase</button>
    <button onclick="App.exportar()" class="bg-gray-600 text-white px-3 py-2 rounded text-sm">Exportar JSON</button>
  </div>
  <span id="estado" class="text-xs text-gray-600 mt-1 block"></span>
</div>

<!-- TABLA -->
<div class="bg-white rounded shadow overflow-auto">
<table class="w-full text-sm border-collapse">
<thead class="bg-gray-800 text-white sticky top-0"><tr>
<th class="p-2">POS</th><th class="p-2">Nombre</th><th class="p-2">Origen</th>
<th class="p-2">Orina</th><th class="p-2">Orina 24h</th><th class="p-2">Orden</th>
<th class="p-2">Plata</th><th class="p-2">Monto</th><th class="p-2">Deriv</th><th class="p-2">Detalle</th>
<th class="p-2">Borrar</th>
</tr></thead>
<tbody id="tablaBody"></tbody>
</table>
</div>

<p class="text-xs text-gray-500 mt-4">Versión escalable - Para agregar funciones, editá CONFIG y TIPOS_ENTREGA arriba. Preguntale a cualquier IA: "agregá campo hisopado a TIPOS_ENTREGA"</p>

</div>

<script>
// ================= APP MODULAR ESCALABLE =================
const App = {
  supa: null,
  pacientes: [],

  init(){
    this.supa = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_KEY);
    this.cargar();
  },

  async cargar(){
    const {data, error} = await this.supa.from(CONFIG.TABLA).select('*').order('pos');
    if(data) this.pacientes = data;
    this.render();
    document.getElementById('estado').innerText = data? `Cargados ${data.length} pacientes` : '';
  },

  parsearWhatsApp(){
    const texto = document.getElementById('waInput').value;
    if(!texto.trim()) return;
    texto.split('\n').filter(l=>l.trim()).forEach((linea, i)=>{
      const low = linea.toLowerCase();
      const origen = low.includes('rawson')? 'Rawson' : 'Trinidad';
      let nombre = linea.split('-')[0].split(':')[0].trim().substring(0,35);
      if(nombre.length < 3) nombre = `Paciente ${this.pacientes.length+1}`;
      this.pacientes.push({
        id: Date.now()+i,
        pos: this.pacientes.length+1,
        nombre,
        origen,
        entrego_orina: low.includes('orina') &&!low.includes('24'),
        tiene_orina_24h: low.includes('orina') && low.includes('24'),
        entrego_orden: low.includes('orden'),
        entrego_plata: low.includes('plata') || low.includes('peso') || low.includes('$'),
        monto_plata: (linea.match(/(\d+)\s*pesos/i) || linea.match(/\$\s*(\d+)/) || [null,''])[1] || '',
        tiene_derivacion: low.includes('deriv'),
        detalle_derivacion: low.includes('deriv')? (linea.split(/deriv/i)[1]?.substring(0,40) || '') : ''
      });
    });
    document.getElementById('waInput').value='';
    this.render();
  },

  editar(id, campo, valor){
    const p = this.pacientes.find(x=>x.id===id);
    p[campo]=valor;
    if(campo==='tiene_orina_24h' && valor) p.entrego_orina=false;
    if(campo==='entrego_orina' && valor) p.tiene_orina_24h=false;
    this.render();
  },

  borrar(id){
    if(confirm('Borrar?')){ this.pacientes = this.pacientes.filter(p=>p.id!==id); this.render(); }
  },

  render(){
    const tb = document.getElementById('tablaBody');
    tb.innerHTML='';
    this.pacientes.sort((a,b)=>a.pos-b.pos).forEach(p=>{
      const tr = document.createElement('tr');
      tr.className = (CONFIG.COLORES[p.origen] || 'bg-white') + ' border-b hover:opacity-80';
      tr.innerHTML = `
        <td class="p-2 text-center font-bold">${p.pos}</td>
        <td class="p-1"><input value="${p.nombre}" onchange="App.editar(${p.id},'nombre',this.value)" class="w-full bg-transparent border-b p-1"></td>
        <td class="p-1"><select onchange="App.editar(${p.id},'origen',this.value)" class="border rounded p-1"><option ${p.origen==='Trinidad'?'selected':''}>Trinidad</option><option ${p.origen==='Rawson'?'selected':''}>Rawson</option></select></td>
        <td class="text-center"><input type="checkbox" ${p.entrego_orina?'checked':''} onchange="App.editar(${p.id},'entrego_orina',this.checked)"></td>
        <td class="text-center"><input type="checkbox" ${p.tiene_orina_24h?'checked':''} onchange="App.editar(${p.id},'tiene_orina_24h',this.checked)"></td>
        <td class="text-center"><input type="checkbox" ${p.entrego_orden?'checked':''} onchange="App.editar(${p.id},'entrego_orden',this.checked)"></td>
        <td class="text-center"><input type="checkbox" ${p.entrego_plata?'checked':''} onchange="App.editar(${p.id},'entrego_plata',this.checked)"></td>
        <td><input value="${p.monto_plata||''}" onchange="App.editar(${p.id},'monto_plata',this.value)" class="w-20 border rounded p-1" placeholder="$"></td>
        <td class="text-center"><input type="checkbox" ${p.tiene_derivacion?'checked':''} onchange="App.editar(${p.id},'tiene_derivacion',this.checked)"></td>
        <td><input value="${p.detalle_derivacion||''}" onchange="App.editar(${p.id},'detalle_derivacion',this.value)" class="w-28 border rounded p-1"></td>
        <td class="text-center"><button onclick="App.borrar(${p.id})" class="text-red-600">X</button></td>
      `;
      tb.appendChild(tr);
    });
    this.actualizarBanner();
  },

  actualizarBanner(){
    const lista = document.getElementById('bannerLista');
    const banner = document.getElementById('bannerRawson');
    const rawson = this.pacientes.filter(p=>p.origen==='Rawson' && (p.entrego_orina || p.tiene_orina_24h || p.entrego_orden || p.entrego_plata || p.tiene_derivacion));
    if(rawson.length===0){ banner.classList.add('hidden'); return; }
    banner.classList.remove('hidden');
    lista.innerHTML = rawson.map(p=>{
      let tareas=[];
      if(p.entrego_orina) tareas.push(TIPOS_ENTREGA.orina.banner);
      if(p.tiene_orina_24h) tareas.push(TIPOS_ENTREGA.orina24.banner);
      if(p.entrego_orden) tareas.push(TIPOS_ENTREGA.orden.banner);
      if(p.entrego_plata) tareas.push(`${TIPOS_ENTREGA.plata.banner} $${p.monto_plata||''}`.trim());
      if(p.tiene_derivacion) tareas.push(`${TIPOS_ENTREGA.derivacion.banner} ${p.detalle_derivacion||''}`.trim());
      return `<div>- <b>${p.nombre} (POS ${p.pos}):</b> Llevar ${tareas.join(' + ')} a Rawson</div>`;
    }).join('');
  },

  async guardar(){
    const {error} = await this.supa.from(CONFIG.TABLA).upsert(this.pacientes, {onConflict:'id'});
    document.getElementById('estado').innerText = error? 'Error: '+error.message : 'Guardado OK en Supabase';
  },

  exportar(){
    const blob = new Blob([JSON.stringify(this.pacientes,null,2)], {type:'application/json'});
    const a = document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='pacientes.json'; a.click();
  }
};

App.init();
</script>
</body>
</html>
