<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Domicilios V11.3 FINAL - 7 COND RAWSON FLUO</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f5f0;--card:#fff;--line:#e8e3d8;--blue:#3b82f6;--green:#16a34a;--dark:#111827;--yellow:#facc15;--orange:#fb923c;--red:#ef4444;--fosfo:#39ff14}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--dark);padding-bottom:90px}
.header{position:sticky;top:0;z-index:30;background:var(--card);border-bottom:1px solid var(--line);padding:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;text-align:center}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:800;cursor:pointer}.btn-d{background:var(--dark);color:#fff}.btn-l{background:#eee}
.table{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:12px;min-width:900px}th{background:var(--dark);color:#fff;padding:8px;position:sticky;top:0}td{padding:7px;border-bottom:1px solid #eee;vertical-align:top}
.pos{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800}.pos-trinidad{background:var(--blue)}.pos-rawson{background:var(--green)}
.dot{width:20px;height:20px;border-radius:50%;display:inline-block;cursor:pointer;border:2px solid #fff;box-shadow:0 0 0 1px #ddd}.dot-pendiente{background:var(--orange)}.dot-si{background:var(--yellow)}.dot-hiv-si{background:var(--fosfo);box-shadow:0 0 10px var(--fosfo);border:2px solid #000}.dot-no{background:var(--red)}
.bannerRawson{padding:14px;border-radius:12px;margin:8px;display:none;font-weight:900;font-size:13px;white-space:pre-wrap;line-height:1.5;background:linear-gradient(90deg,#000,#0a0a0a);color:#39ff14;border:3px solid #39ff14;box-shadow:0 0 15px #39ff14}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;z-index:100;padding:10px;overflow:auto}.box{background:#fff;border-radius:16px;padding:16px;max-width:600px;margin:20px auto}
input,select,textarea{padding:10px;border:1px solid #ddd;border-radius:10px;background:#fff;width:100%;font-size:14px}
.sticky-col{position:sticky;left:0;background:#fff;z-index:3;border-right:2px solid #ddd}
.fila-rawson-listo{background:linear-gradient(90deg,#39ff14,#00ff7f)!important;font-weight:900!important;border-left:8px solid #000!important;box-shadow:0 0 12px #39ff14!important}
</style>
</head>
<body>
<div class="header">
<div style="display:flex;justify-content:space-between"><b>V11.3 FINAL - RAWSON 7 COND FLUO</b><small id="fecha"></small></div>
<div id="bannerRawson" class="bannerRawson"></div>
<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:8px"><input id="q" placeholder="Buscar..." oninput="filtrar()" style="flex:2"><select id="fMut" onchange="filtrar()"><option value="">Todas</option><option>Trinidad</option><option>Rawson</option></select><button class="btn btn-d" onclick="abrirNuevo()">+ Nuevo</button><button class="btn btn-l" onclick="document.getElementById('importBox').style.display='block'">📋 Importar WhatsApp</button></div>
</div>
<div id="importBox" class="box" style="display:none;border:3px solid #000"><h3>Importar WhatsApp - Filtra a Carina Jefa</h3><textarea id="txtImport" rows="10"></textarea><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-d" onclick="parsearWhatsApp()">CARGAR</button><button class="btn btn-l" onclick="document.getElementById('importBox').style.display='none'">Cerrar</button></div></div>
<div class="table"><table><thead><tr><th class="sticky-col">POS</th><th>✓</th><th>PACIENTE</th><th>COBRO</th><th>PAGÓ?</th><th>ORINA</th><th>24H</th><th>FECAL</th><th>ORDEN</th><th>HIV</th><th>DERIV</th><th>MAPA</th></tr></thead><tbody id="tbody"></tbody></table></div>
<div id="modal" class="modal"><div class="box"><input id="f_pos" type="number" placeholder="POS"><input id="f_nombre" placeholder="Nombre completo"><input id="f_telefono" placeholder="Tel"><input id="f_dni" placeholder="DNI"><input id="f_domicilio" placeholder="Domicilio"><input id="f_entre" placeholder="Entre calles"><input id="f_origen" placeholder="Trinidad/Rawson"><select id="f_mutual"><option>Trinidad</option><option>Rawson</option><option>Particular</option></select><input id="f_monto" type="number" placeholder="Monto"><label><input type="checkbox" id="f_pagado"> ¿Pagó?</label><select id="f_estado_orina"><option value="pendiente">Orina: Pendiente</option><option value="si">Entregó</option><option value="no">No entregó</option></select><select id="f_estado_orina24"><option value="pendiente">Orina 24: Pendiente</option><option value="si">Entregó</option><option value="no">No entregó</option></select><select id="f_estado_fecal"><option value="pendiente">Fecal: Pendiente</option><option value="si">Entregó</option><option value="no">No entregó</option></select><select id="f_estado_orden"><option value="pendiente">Orden: Pendiente</option><option value="si">Entregó</option><option value="no">No entregó</option></select><select id="f_estado_hiv"><option value="pendiente">HIV: Pendiente</option><option value="si">Firmó FOSFO</option><option value="no">No firmó</option></select><select id="f_estado_deriv"><option value="pendiente">Deriv: Pendiente</option><option value="si">Sí</option><option value="no">No</option></select><input type="hidden" id="f_id"><button onclick="cerrar()">Cancelar</button><button onclick="guardar()">💾 Guardar</button></div></div>
<script>
const SB_URL="https://bsgneveblhokjttpmbrj.supabase.co";const SB_KEY="sb_publishable_tpkAdsAtnheW3Eqx-wRW7Q_C9v0I_aY";const sb=supabase.createClient(SB_URL,SB_KEY);
let todos=[];let sel=new Set();document.getElementById('fecha').innerText=new Date().toLocaleDateString('es-AR');
async function cargar(){const {data}=await sb.from('pacientes').select('*').order('pos',{ascending:true});todos=data||[];render(todos);}
function colorDot(e,t){if(e=='si') return t=='hiv'?'dot-hiv-si':'dot-si';if(e=='no') return 'dot-no';return 'dot-pendiente'}
function esDeRawson(p){const txt=((p.origen||'')+' '+(p.mutual||'')+' '+(p.domicilio||'')+' '+(p.entre_calles||'')).toLowerCase();return txt.includes('rawson');}
function getDetalleRawson(p){let c=[];if((p.estado_orina||'')=='si') c.push('ORINA COMPLETA');if((p.estado_orina24||'')=='si') c.push('ORINA 24HS');if((p.estado_fecal||'')=='si') c.push('MATERIA FECAL');if((p.estado_orden||'')=='si') c.push('ORDEN');if((p.estado_hiv||'')=='si') c.push('HIV FIRMADO');if((p.estado_deriv||'')=='si') c.push('DERIVACION');if(!!p.entrego_plata) c.push('PAGO INMEDIATO');return c;}
function render(data){
  const tb=document.getElementById('tbody');tb.innerHTML='';let letreros=[];
  data.forEach(p=>{
    const esRawson=esDeRawson(p);const detalle=getDetalleRawson(p);const cumple=esRawson&&detalle.length>0;
    if(cumple){
      let txt='';if(detalle.length==1&&detalle[0]=='ORINA COMPLETA') txt=`💧 SI ESTAS CERCA: ${p.nombre} - DEJAR ORINA COMPLETA SOLO SI ESTÁS CERCA DE RAWSON`;
      else if(detalle.length==1&&detalle[0]=='MATERIA FECAL') txt=`💩 SI ESTAS CERCA: ${p.nombre} - DEJAR MATERIA FECAL SOLO SI ESTÁS CERCA DE RAWSON`;
      else if(detalle.length==1&&detalle[0]=='ORDEN') txt=`📄 SI ESTAS CERCA: ${p.nombre} - DEJAR / RETIRAR ORDEN SOLO SI ESTÁS CERCA DE RAWSON`;
      else txt=`📍 SI ESTAS CERCA: ${p.nombre} - ${detalle.join(' + ')} - SOLO SI ESTÁS CERCA DE RAWSON`;
      letreros.push(txt);
    }
    const tr=document.createElement('tr');if(cumple) tr.className='fila-rawson-listo';
    const posC=esRawson?'pos-rawson':'pos-trinidad';
    tr.innerHTML=`<td class="sticky-col"><div class="pos ${posC}">${p.pos||''}</div></td><td><input type="checkbox" ${sel.has(p.id)?'checked':''} onchange="toggle(${p.id})"></td><td><b>${p.nombre||''}</b></td><td>$${p.monto_plata||0}</td><td><input type="checkbox" ${p.entrego_plata?'checked':''} onchange="togglePago(${p.id},this.checked)"></td><td><span class="dot ${colorDot(p.estado_orina||'pendiente')}" onclick="cambiarEstado(${p.id},'estado_orina')"></span></td><td><span class="dot ${colorDot(p.estado_orina24||'pendiente')}" onclick="cambiarEstado(${p.id},'estado_orina24')"></span></td><td><span class="dot ${colorDot(p.estado_fecal||'pendiente')}" onclick="cambiarEstado(${p.id},'estado_fecal')"></span></td><td><span class="dot ${colorDot(p.estado_orden||'pendiente')}" onclick="cambiarEstado(${p.id},'estado_orden')"></span></td><td><span class="dot ${colorDot(p.estado_hiv||'pendiente','hiv')}" onclick="cambiarEstado(${p.id},'estado_hiv')"></span></td><td><span class="dot ${colorDot(p.estado_deriv||'pendiente')}" onclick="cambiarEstado(${p.id},'estado_deriv')"></span></td><td><button onclick="maps('${(p.domicilio||'')}')">📍</button></td>`;
    tb.appendChild(tr)
  });
  const b=document.getElementById('bannerRawson');if(letreros.length){b.style.display='block';b.innerText=letreros.join('\n');}else b.style.display='none'
}
function toggle(id){if(sel.has(id))sel.delete(id);else sel.add(id);render(todos)}
async function togglePago(id,chk){await sb.from('pacientes').update({entrego_plata:chk,fecha_pago:chk?new Date().toISOString().slice(0,10):null}).eq('id',id);cargar()}
async function cambiarEstado(id,campo){const p=todos.find(x=>x.id==id);let cur=p[campo]||'pendiente';let next=cur=='pendiente'?'si':cur=='si'?'no':'pendiente';await sb.from('pacientes').update({[campo]:next}).eq('id',id);cargar()}
function maps(d){window.open('https://www.google.com/maps/search/'+encodeURIComponent(d),'_blank')}
function abrirNuevo(){document.getElementById('modal').style.display='block';}function cerrar(){document.getElementById('modal').style.display='none'}
async function guardar(){const id=document.getElementById('f_id').value;const payload={pos:parseInt(document.getElementById('f_pos').value)||1,nombre:document.getElementById('f_nombre').value,telefono:document.getElementById('f_telefono').value||null,domicilio:document.getElementById('f_domicilio').value||null,origen:document.getElementById('f_origen').value||null,mutual:document.getElementById('f_mutual').value||null,monto_plata:document.getElementById('f_monto').value||null,entrego_plata:document.getElementById('f_pagado').checked,estado_orina:document.getElementById('f_estado_orina').value,estado_orina24:document.getElementById('f_estado_orina24').value,estado_fecal:document.getElementById('f_estado_fecal').value,estado_orden:document.getElementById('f_estado_orden').value,estado_hiv:document.getElementById('f_estado_hiv').value,estado_deriv:document.getElementById('f_estado_deriv').value};let r;if(id) r=await sb.from('pacientes').update(payload).eq('id',id);else r=await sb.from('pacientes').insert(payload);cerrar();cargar()}
cargar();
</script>
</body>
  </html>
